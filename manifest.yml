modules:
  jira:projectPage:
    - key: project-page
      resource: main
      resolver:
        function: resolver
      title: Project Page
  jira:adminPage:
    - key: admin-page
      resource: admin-page
      resolver:
        function: resolver
      title: Admin Page    
  jira:globalPage:
    - key: global-page
      title: Global Pages
      resource: global-page
      resolver:
        function: resolver
      pages:
        - title: Page 1
          key: page-1
          route: '/page-1'
        - title: Page 2
          key: page-2
          route: '/page-2'
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/project-page/build
  - key: global-page
    path: static/global-pages/build
  - key: admin-page
    path: static/admin-page/build
permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - storage:app
  content:
    styles:
      - 'unsafe-inline'
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/92fe9c94-cf3b-4393-9af7-2066ec93c818